<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reactor Control</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow background-glow--left"></div>
    <div class="background-glow background-glow--right"></div>

    <div class="layout-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand__mark" aria-hidden="true"></div>
          <div>
            <p class="brand__eyebrow">OpenComputers</p>
            <h1 class="brand__title">Reactor Control</h1>
          </div>
        </div>

        <nav id="sidebar-nav" class="sidebar__nav" aria-label="Навигация"></nav>

        <div class="sidebar__footer">
          <p class="sidebar__footer-title">Связь с комплексом</p>
          <p class="sidebar__footer-copy">
            Панель ждёт телеметрию каждые 45 секунд и автоматически подстраивает
            интерфейс под состояние станции.
          </p>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar__titles">
            <p id="page-eyebrow" class="topbar__eyebrow">Панель</p>
            <h2 id="page-title" class="topbar__title">Главная</h2>
            <p id="page-subtitle" class="topbar__subtitle">Загрузка телеметрии...</p>
          </div>

          <div class="topbar__controls">
            <div class="topbar__status">
              <p id="refresh-countdown" class="status-chip">Следующее обновление через 45с</p>
              <p id="sync-age" class="status-chip status-chip--muted">Ожидание ответа API...</p>
            </div>

            <button id="manual-refresh" class="action-pill action-pill--primary" type="button">
              Обновить
            </button>
            <button id="notify-button" class="icon-button" type="button" aria-label="Уведомления"></button>
            <button id="settings-button" class="icon-button" type="button" aria-label="Настройки"></button>
          </div>
        </header>

        <p id="live-message" class="live-message" aria-live="polite"></p>
        <main id="app" class="app">
          <section class="loading-panel">
            <div class="loading-panel__scanner"></div>
            <p>Поднимаем интерфейс контроля реакторов...</p>
          </section>
        </main>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
