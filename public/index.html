<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reactor Grid Control</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="background-glow background-glow--left"></div>
    <div class="background-glow background-glow--right"></div>
    <div class="shell">
      <header class="masthead">
        <div class="masthead__copy">
          <p class="eyebrow">OpenComputers / Reactor Grid</p>
          <h1>Пульт управления реакторами</h1>
          <p class="lead">
            Телеметрия реакторов, Flux и МЭ-сети в одном окне. Цикл обмена между
            агентом и сайтом настроен на 45 секунд, чтобы спокойно переживать кд
            МЭ-интерфейса.
          </p>
        </div>

        <div class="masthead__panel">
          <button id="manual-refresh" class="ghost-button" type="button">
            Обновить сейчас
          </button>
          <p id="refresh-countdown" class="status-line">
            Следующее обновление через 45с
          </p>
          <p id="sync-age" class="status-line status-line--muted">Загрузка данных...</p>
          <p id="live-message" class="live-message" aria-live="polite"></p>
        </div>
      </header>

      <main id="app" class="app">
        <section class="loading-card">
          <div class="loading-card__scan"></div>
          <p>Собираем телеметрию комплекса...</p>
        </section>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
